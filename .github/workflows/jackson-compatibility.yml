name: (🧩) Jackson Compatibility

# The library supports Jackson 2.9 and newer. Compiles against the current Jackson version and runs
# the tests against older ones, so that no newer Jackson API slips in unnoticed.

on:
  push:
    branches-ignore:
    - 'main'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jackson: ['2.9.10', '2.12.7', '2.15.4', '2.18.6']
    name: Jackson ${{ matrix.jackson }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: Compile against the current Jackson version
      run: mvn -B -ntp test-compile
    - name: Run the tests against Jackson ${{ matrix.jackson }}
      run: mvn -B -ntp surefire:test -Djackson.version=${{ matrix.jackson }}
